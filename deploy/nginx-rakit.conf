# Nginx reverse proxy untuk rakit.io + hosting user di <username>.rakit.io.
# Salin ke /etc/nginx/sites-available/rakit, lalu:
#   sudo ln -sf /etc/nginx/sites-available/rakit /etc/nginx/sites-enabled/rakit
#   sudo nginx -t && sudo systemctl reload nginx
#
# Port upstream (3011) = server Go (deploy/rakit-go.service). Server Node lama (rakit.service, 3010)
# hanya untuk membatalkan migrasi, lihat go/README.md. App hanya listen di 127.0.0.1; jangan buka
# port-nya ke publik (lihat /root/app-guard.nft).
#
# Sertifikat: wildcard *.rakit.io via Let's Encrypt (certbot DNS/HTTP challenge).

server {
    listen 80;
    listen [::]:80;
    server_name rakit.io *.rakit.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rakit.io *.rakit.io;

    ssl_certificate     /etc/letsencrypt/live/rakit.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rakit.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
