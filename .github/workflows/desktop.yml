# Aplikasi desktop: setiap push ke master yang mengubah kode aplikasi dibangun untuk Linux, macOS (Apple Silicon &
# Intel), dan Windows, lalu diunggah ke satu GitHub Release (desktop-v0.1.<nomor run>).
#
# Alur: `prepare` membuat release draft -> `build` (4 OS paralel) mengunggah installer ke draft itu -> `publish`
# menerbitkannya sebagai "latest" hanya bila semua build berhasil, supaya link releases/latest di landing page tidak
# pernah menunjuk ke release yang belum lengkap. Build yang gagal meninggalkan draft (hapus manual di halaman Releases).
#
# Bisa juga dijalankan manual: tab Actions -> Desktop -> Run workflow.
name: Desktop

on:
  push:
    branches: [master]
    paths:
      - go/**
      - desktop/**
      - assets-source/**
      - public/**
      - templates/**
      - deploy/agent/**
      - package.json
      - package-lock.json
      - build-assets.sh
      - scripts/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

# Satu release dalam satu waktu; push berikutnya menunggu (tidak membatalkan) supaya tidak ada draft yatim.
concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      # Versi = <major>.<minor> dari tauri.conf.json + nomor run (naikkan major/minor di tauri.conf.json bila perlu).
      - id: v
        run: |
          base=$(jq -r .version desktop/src-tauri/tauri.conf.json | cut -d. -f1,2)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          notes=$(git log -1 --format='%s%n%n%b' | sed '/^Co-Authored-By:/d')
          gh release create "desktop-v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "rakit desktop $VERSION" \
            --notes "$notes"$'\n\n'"Commit: $GITHUB_SHA"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"desktop-v$VERSION\") | .id" | head -1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc lama: AppImage/.deb jalan di lebih banyak distro
            target: x86_64-unknown-linux-gnu
          - os: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
          - os: macos-15-intel # Intel; runtime agen (node_modules & Chromium) harus dibangun di arsitektur yang sama
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Paket sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Versi aplikasi
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), p = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          ' "${{ needs.prepare.outputs.version }}"

      - name: Dependensi npm
        shell: bash
        run: |
          npm ci
          (cd desktop && npm ci)

      # Langkah yang biasanya dijalankan beforeBuildCommand, di sini lewat Git Bash supaya sama di semua OS.
      - name: Sidecar server & aset editor
        shell: bash
        env:
          RAKIT_SKIP_ASSETS: 1 # aset dibangun di baris pertama (npm run build memanggil bash lewat cmd di Windows)
        run: |
          bash build-assets.sh
          bash desktop/scripts/build-sidecar.sh
      - name: Runtime mode Agen
        shell: bash
        run: bash desktop/scripts/build-agent-runtime.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Opsional, untuk macOS yang ditandatangani & dinotarisasi (tanpa ini pengguna perlu klik kanan -> Open):
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.ci.conf.json
          releaseId: ${{ needs.prepare.outputs.release_id }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Terbitkan release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" \
            -F draft=false -f make_latest=true
