<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — rakit.io</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="/css/admin.css">
  <script>
    // Tema mengikuti pilihan di Pengaturan editor (Terang/Gelap), dipasang sebelum halaman tergambar.
    try { if (JSON.parse(localStorage.getItem('rakit.theme')) === 'dark') document.documentElement.dataset.theme = 'dark'; } catch { /* abaikan */ }
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/editor"><img class="logo" src="/logo.svg" alt=""><span class="wordmark">rakit<span class="dim">.io</span></span></a>
    <span class="page-title">Dashboard pemilik</span>
    <nav class="tabs" role="tablist" aria-label="Bagian dashboard">
      <button type="button" role="tab" data-tab="ringkasan">Ringkasan</button>
      <button type="button" role="tab" data-tab="pengguna">Pengguna &amp; token</button>
      <button type="button" role="tab" data-tab="pengaturan">Pengaturan</button>
    </nav>
    <div class="top-actions">
      <div class="range" role="radiogroup" aria-label="Periode">
        <button type="button" role="radio" data-days="7">7 hari</button>
        <button type="button" role="radio" data-days="30">30 hari</button>
        <button type="button" role="radio" data-days="90">90 hari</button>
      </div>
      <button type="button" class="icon-btn" id="refresh" title="Muat ulang">
        <svg viewBox="0 0 16 16"><path d="M13.45 5.17A6 6 0 1 0 14 8h-1a5 5 0 1 1-.8-2.73l-1.7.23.14 1 3.4-.5-.5-3.4-1 .14z"/></svg>
      </button>
      <a class="back" href="/editor">Ke editor</a>
    </div>
  </header>

  <main class="page" id="tab-ringkasan" role="tabpanel" aria-label="Ringkasan">
    <p class="loading">Memuat statistik…</p>
  </main>

  <main class="page" id="tab-pengguna" role="tabpanel" aria-label="Pengguna &amp; token" hidden>
    <p class="loading">Memuat statistik…</p>
  </main>

  <main class="page" id="tab-pengaturan" role="tabpanel" aria-label="Pengaturan" hidden>
    <section id="plans" aria-label="Harga langganan"><p class="loading">Memuat harga langganan…</p></section>
    <section id="aiModels" aria-label="Model AI editor"></section>
    <section id="assistantAdmin" aria-label="Asisten AI website"></section>
  </main>

  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <script src="/js/admin.js"></script>
</body>
</html>
