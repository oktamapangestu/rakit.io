<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Editor — rakit.io</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- Monaco (editor kode) diunduh sejak awal, paralel dengan file lain; dijalankan oleh editor.js.
       JANGAN preload editor.main.css: loader Monaco mengira stylesheet-nya sudah terpasang bila ada <link> dengan
       alamat yang sama, lalu tidak memasangnya (nomor baris & widget editor jadi berantakan). -->
  <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js">
  <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/editor/editor.main.js">
  <!-- Font tidak menahan tampilan pertama (pakai font sistem dulu, lalu berganti saat font selesai diunduh). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/css/editor.css">
  <script>
    // Tema (terang/gelap) dipasang sebelum halaman tergambar, supaya tidak berkedip.
    try { if (JSON.parse(localStorage.getItem('rakit.theme')) === 'dark') document.documentElement.dataset.theme = 'dark'; } catch { /* abaikan */ }
  </script>
</head>
<body data-mobile-view="editor" data-layout="coding">
  <script>
    // Tampilan editor (Simple/Coding) dipasang sebelum halaman tergambar, supaya tidak berkedip.
    try { if (JSON.parse(localStorage.getItem('rakit.layout')) === 'simple') document.body.dataset.layout = 'simple'; } catch { /* abaikan */ }
  </script>
  <!-- Kerangka editor (termasuk menu konteks & toast) digambar App.svelte (assets-source/editor/shell). -->
  <div class="app"></div>

  <!-- Dialog dipasang ke sini oleh openDialog() di editor.js. -->
  <div class="modal-backdrop" id="modal" hidden></div>

  <script>
    // Monaco dimuat dari CDN; worker harus diproksikan lewat data: URL agar lolos same-origin.
    window.MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
    window.MonacoEnvironment = {
      getWorkerUrl() {
        const base = window.MONACO_BASE;
        return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
          `self.MonacoEnvironment={baseUrl:'${base}/'};importScripts('${base}/vs/base/worker/workerMain.js');`
        );
      },
    };
  </script>
  <script src="/js/textedit.js" defer></script>
  <script src="/js/editor.js" defer></script>
</body>
</html>
