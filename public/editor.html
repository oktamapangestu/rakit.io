<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Editor — rakit.io</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen&display=swap">
  <link rel="stylesheet" href="/css/editor.css">
  <script>
    // Tema (terang/gelap) dipasang sebelum halaman tergambar, supaya tidak berkedip.
    try { if (JSON.parse(localStorage.getItem('rakit.theme')) === 'dark') document.documentElement.dataset.theme = 'dark'; } catch { /* abaikan */ }
  </script>
</head>
<body data-mobile-view="editor" data-layout="coding">
  <script>
    // Tampilan editor (Simple/Coding) dipasang sebelum halaman tergambar, supaya tidak berkedip.
    try { if (JSON.parse(localStorage.getItem('rakit.layout')) === 'simple') document.body.dataset.layout = 'simple'; } catch { /* abaikan */ }
  </script>
  <div class="app">
    <header class="topbar">
      <div class="top-left">
        <a class="brand" href="/editor" title="rakit.io"><img class="logo" src="/logo.svg" alt=""><span class="brand-name">rakit<span class="dim">.io</span></span></a>
        <button class="chip-btn" id="toggleSidebar" title="Tampilkan/sembunyikan file (Ctrl+B)">
          <svg viewBox="0 0 16 16"><path d="M2 2.5A1.5 1.5 0 0 1 3.5 1h9A1.5 1.5 0 0 1 14 2.5v11a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5zM3.5 2a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5H6V2zM7 2v12h5.5a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5z"/></svg>
        </button>
        <div class="project-chip">
          <button type="button" class="project-switch" id="projectSwitch" title="Ganti atau buat project">
            <svg viewBox="0 0 16 16"><path d="M1.5 2h5l1 1.5h7l.5.5v9.5l-.5.5h-13l-.5-.5v-11zM2 3v9.5h12V4.5H7.2L6.2 3zm5.5 3.5v2h-2v1h2v2h1v-2h2v-1h-2v-2z"/></svg>
            <svg class="caret" viewBox="0 0 16 16"><path d="M4 6h8l-4 5z"/></svg>
          </button>
          <span class="live-dot" title="Online"></span>
          <a id="siteLink" target="_blank" rel="noopener" title="Buka website di tab baru"></a>
          <button class="mini-btn" id="copySite" title="Salin URL">
            <svg viewBox="0 0 16 16"><path d="M4 2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/></svg>
          </button>
        </div>
      </div>

      <div class="top-center">
        <div class="layout-switch" role="radiogroup" aria-label="Tampilan editor">
          <button type="button" role="radio" data-layout="simple" title="Simple: cukup ngobrol dengan AI dan lihat hasilnya">
            <svg viewBox="0 0 16 16"><path d="M8 0l1.6 4.4L14 6l-4.4 1.6L8 12 6.4 7.6 2 6l4.4-1.6zM13 10l.8 2.2L16 13l-2.2.8L13 16l-.8-2.2L10 13l2.2-.8z"/></svg>
            Simple
          </button>
          <button type="button" role="radio" data-layout="coding" title="Coding: file, editor kode, database, diagram, dan riwayat">
            <svg viewBox="0 0 16 16"><path d="M5.3 4.3 1.6 8l3.7 3.7-.7.7L.2 8l4.4-4.4zm5.4 0 .7-.7L15.8 8l-4.4 4.4-.7-.7L14.4 8z"/></svg>
            Coding
          </button>
        </div>
        <span class="save-pill" id="statusSave"></span>
      </div>

      <div class="top-right">
        <button class="chip-btn" id="togglePreview" title="Tampilkan/sembunyikan preview (Ctrl+\)">
          <svg viewBox="0 0 16 16"><path d="M8 3C4.5 3 1.9 5.4 1 8c.9 2.6 3.5 5 7 5s6.1-2.4 7-5c-.9-2.6-3.5-5-7-5m0 8.5A3.5 3.5 0 1 1 8 4.5a3.5 3.5 0 0 1 0 7m0-5.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg>
          <span>Preview</span>
        </button>
        <a class="chip-btn" id="guideLink" href="/panduan" target="_blank" rel="noopener" title="Panduan menulis prompt">
          <svg viewBox="0 0 16 16"><path d="M3 1.5A1.5 1.5 0 0 1 4.5 0h7A1.5 1.5 0 0 1 13 1.5v13a.5.5 0 0 1-.77.42L8 12.05 3.77 14.92A.5.5 0 0 1 3 14.5zm1.5-.5a.5.5 0 0 0-.5.5v11.53l3.73-2.53a.5.5 0 0 1 .54 0L12 13.53V1.5a.5.5 0 0 0-.5-.5zM5.5 3h5v1h-5zm0 2.5h5v1h-5zm0 2.5h3v1h-3z"/></svg>
          <span>Panduan</span>
        </a>
        <button type="button" class="release-btn" id="publishBtn" title="Publikasikan versi dev ke website publik" hidden>
          <svg viewBox="0 0 16 16"><path d="M8 1 3.5 5.5l.7.7L7.5 2.9V11h1V2.9l3.3 3.3.7-.7zM2 10v4.5l.5.5h11l.5-.5V10h-1v4H3v-4z"/></svg>
          <span>Publikasikan</span>
          <i class="release-dot" aria-hidden="true"></i>
        </button>
        <a class="publish-btn" id="visitSite" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16"><path d="M9 2v1h3.3L6.6 8.6l.8.8L13 3.7V7h1V2zM12 13H3V4h4V3H2v11h11V9h-1z"/></svg>
          <span>Lihat situs</span>
        </a>
        <button type="button" class="plan-badge" id="planBadge" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.2l3.2 2.3L8 3l2.8 4.5L14 5.2 12.8 12H3.2zM3.3 13h9.4v1.2H3.3z"/></svg>
          <span class="plan-badge-name"></span>
          <span class="plan-badge-days"></span>
        </button>
        <button class="avatar" id="avatarBtn" title="Akun"></button>
      </div>
    </header>

    <div class="workbench">
      <aside class="panel sidebar" id="sidebar">
        <div class="panel-head">
          <span class="panel-title">File</span>
          <div class="panel-actions">
            <button class="icon-btn" id="newFileBtn" title="File baru">
              <svg viewBox="0 0 16 16"><path d="M9.5 1H4a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 4 15h8a1.5 1.5 0 0 0 1.5-1.5V5zM12.5 13.5a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5v-11A.5.5 0 0 1 4 2h5v3.5h3.5zM8.5 7v2h-2v1h2v2h1v-2h2V9h-2V7z"/></svg>
            </button>
            <button class="icon-btn" id="newFolderBtn" title="Folder baru">
              <svg viewBox="0 0 16 16"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h3.3l1.5 1.5h6.2A1.5 1.5 0 0 1 15 5v7.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H6.9L5.4 3zM7.5 6v2h-2v1h2v2h1V9h2V8h-2V6z"/></svg>
            </button>
            <button class="icon-btn" id="uploadBtn" title="Upload gambar">
              <svg viewBox="0 0 16 16"><path d="M2.5 2A1.5 1.5 0 0 0 1 3.5v9A1.5 1.5 0 0 0 2.5 14H9v-1H2.5a.5.5 0 0 1-.5-.5v-.8l3.2-3.3 2.1 2.1.7-.7-2.8-2.8L2 10.3V3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5V8h1V3.5A1.5 1.5 0 0 0 13.5 2zM10.5 5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M12.5 9.3 10 11.8l.7.7 1.3-1.3V15h1v-3.8l1.3 1.3.7-.7z"/></svg>
            </button>
            <button class="icon-btn" id="refreshBtn" title="Muat ulang">
              <svg viewBox="0 0 16 16"><path d="M13.45 5.17A6 6 0 1 0 14 8h-1a5 5 0 1 1-.8-2.73l-1.7.23.14 1 3.4-.5-.5-3.4-1 .14z"/></svg>
            </button>
            <button class="icon-btn feature-info-btn" id="filesInfo" title="Apa itu file &amp; folder?" aria-label="Penjelasan file &amp; folder">
              <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1m0 1a6 6 0 1 0 0 12A6 6 0 0 0 8 2m.5 5v5h-1V7zM8 4.25a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5"/></svg>
            </button>
            <button class="icon-btn" id="collapseBtn" title="Tutup semua folder">
              <svg viewBox="0 0 16 16"><path d="M4 6h8v1H4zm0 3h8v1H4zM2.5 2h11A1.5 1.5 0 0 1 15 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5v-9A1.5 1.5 0 0 1 2.5 2m0 1a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5z"/></svg>
            </button>
          </div>
        </div>
        <div class="project" id="projectName"></div>
        <div class="tree" id="tree" tabindex="0"></div>
        <div class="usage" id="usage"></div>
      </aside>
      <div class="splitter" data-target="sidebar"><i></i></div>

      <main class="panel editor-area" id="editorArea" data-mode="ai">
        <div class="editor-top">
          <div class="tabs" id="tabs"></div>
          <div class="ai-head">
            <span class="ai-title">
              <svg viewBox="0 0 16 16"><path d="M8 0l1.6 4.4L14 6l-4.4 1.6L8 12 6.4 7.6 2 6l4.4-1.6zM13 10l.8 2.2L16 13l-2.2.8L13 16l-.8-2.2L10 13l2.2-.8z"/></svg>
              Asisten AI
            </span>
            <button type="button" class="credit-badge" id="aiCredits" title="Kredit AI"></button>
            <button class="icon-btn" id="aiHistory" title="Riwayat percakapan">
              <svg viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 1 1-6.14 4.35l.94.33A5.5 5.5 0 1 0 8 2.5c-1.77 0-3.35.84-4.35 2.15H5.5v1H2V2.15h1v1.72A6.48 6.48 0 0 1 8 1.5M7.5 4h1v3.8l2.6 1.5-.5.87-3.1-1.8z"/></svg>
            </button>
            <button class="icon-btn" id="aiClear" title="Hapus semua riwayat">
              <svg viewBox="0 0 16 16"><path d="M6 1h4l.5.5V3H14v1h-1v10.5l-.5.5h-9l-.5-.5V4H2V3h3.5V1.5zM6.5 3h3V2h-3zM4 4v10h8V4zm2 2h1v6H6zm3 0h1v6H9z"/></svg>
            </button>
            <button class="icon-btn" id="aiReset" title="Percakapan baru">
              <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 0 7 7h-1a6 6 0 1 1-1.76-4.24L10.5 5.5H15V1l-1.76 1.76A6.98 6.98 0 0 0 8 1"/></svg>
            </button>
          </div>
          <div class="data-head">
            <span class="ai-title data-title">
              <svg viewBox="0 0 16 16"><path d="M8 1C4.7 1 2 2.1 2 3.5v9C2 13.9 4.7 15 8 15s6-1.1 6-2.5v-9C14 2.1 11.3 1 8 1m0 1c2.9 0 5 .9 5 1.5S10.9 5 8 5 3 4.1 3 3.5 5.1 2 8 2M3 5c1.1.6 2.9 1 5 1s3.9-.4 5-1v3.5C13 9.1 10.9 10 8 10s-5-.9-5-1.5zm0 5c1.1.6 2.9 1 5 1s3.9-.4 5-1v2.5c0 .6-2.1 1.5-5 1.5s-5-.9-5-1.5z"/></svg>
              Database
            </span>
          </div>
          <div class="data-head diagram-head">
            <span class="ai-title diagram-title">
              <svg viewBox="0 0 16 16"><path d="M1 1.5h5l.5.5v3l-.5.5H4v2h4V7l.5-.5h5l.5.5v3l-.5.5h-5L8 10V8.5H4v3h2l.5.5v3l-.5.5H1l-.5-.5v-3L1 11.5h2v-6H1L.5 5V2zm.5 1V4.5h4v-2zm8 5v2h4v-2zm-8 5v2h4v-2z"/></svg>
              Diagram
            </span>
          </div>
          <div class="mode-switch" role="tablist" aria-label="Mode editor">
            <button role="tab" data-mode="code" title="Editor kode">
              <svg viewBox="0 0 16 16"><path d="M5.3 4.3 1.6 8l3.7 3.7-.7.7L.2 8l4.4-4.4zm5.4 0 .7-.7L15.8 8l-4.4 4.4-.7-.7L14.4 8z"/></svg>
              Code
            </button>
            <button role="tab" data-mode="ai" title="Asisten AI (Ctrl+I)">
              <svg viewBox="0 0 16 16"><path d="M8 0l1.6 4.4L14 6l-4.4 1.6L8 12 6.4 7.6 2 6l4.4-1.6zM13 10l.8 2.2L16 13l-2.2.8L13 16l-.8-2.2L10 13l2.2-.8z"/></svg>
              AI
            </button>
            <button role="tab" data-mode="data" title="Database">
              <svg viewBox="0 0 16 16"><path d="M8 1C4.7 1 2 2.1 2 3.5v9C2 13.9 4.7 15 8 15s6-1.1 6-2.5v-9C14 2.1 11.3 1 8 1m0 1c2.9 0 5 .9 5 1.5S10.9 5 8 5 3 4.1 3 3.5 5.1 2 8 2M3 5c1.1.6 2.9 1 5 1s3.9-.4 5-1v3.5C13 9.1 10.9 10 8 10s-5-.9-5-1.5zm0 5c1.1.6 2.9 1 5 1s3.9-.4 5-1v2.5c0 .6-2.1 1.5-5 1.5s-5-.9-5-1.5z"/></svg>
              Data
            </button>
            <button role="tab" data-mode="diagram" title="Diagram buatan AI (UML, ERD, peta halaman, alur data)">
              <svg viewBox="0 0 16 16"><path d="M1 1.5h5l.5.5v3l-.5.5H4v2h4V7l.5-.5h5l.5.5v3l-.5.5h-5L8 10V8.5H4v3h2l.5.5v3l-.5.5H1l-.5-.5v-3L1 11.5h2v-6H1L.5 5V2zm.5 1V4.5h4v-2zm8 5v2h4v-2zm-8 5v2h4v-2z"/></svg>
              Diagram
            </button>
            <button role="tab" data-mode="fn" title="Fungsi serverless: kode backend di /api/fn/…">
              <svg viewBox="0 0 16 16"><path d="M9.3 1 3 9.2h4.2L6.3 15l6.6-8.4H8.7z"/></svg>
              Fungsi
            </button>
            <button role="tab" data-mode="history" title="Riwayat versi: lihat dan kembalikan versi sebelumnya">
              <svg viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 1 1-6.14 4.35l.94.33A5.5 5.5 0 1 0 8 2.5c-1.77 0-3.35.84-4.35 2.15H5.5v1H2V2.15h1v1.72A6.48 6.48 0 0 1 8 1.5M7.5 4h1v3.8l2.6 1.5-.5.87-3.1-1.8z"/></svg>
              Riwayat
            </button>
          </div>
          <button type="button" class="icon-btn feature-info-btn" id="modeInfo" title="Apa itu fitur ini?" aria-label="Penjelasan fitur ini">
            <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1m0 1a6 6 0 1 0 0 12A6 6 0 0 0 8 2m.5 5v5h-1V7zM8 4.25a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5"/></svg>
          </button>
        </div>

        <div class="code-view" id="codeView" hidden>
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="editor-wrap">
            <div id="editor"></div>
            <div class="welcome" id="welcome">
              <img class="welcome-logo" src="/logo.svg" alt="">
              <h2>Siap bikin sesuatu?</h2>
              <p>Pilih file di panel kiri, atau mulai dari sini.</p>
              <div class="welcome-actions">
                <button class="welcome-btn" data-action="new-file">
                  <svg viewBox="0 0 16 16"><path d="M9.5 1H4a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 4 15h8a1.5 1.5 0 0 0 1.5-1.5V5zM12.5 13.5a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5v-11A.5.5 0 0 1 4 2h5v3.5h3.5zM8.5 7v2h-2v1h2v2h1v-2h2V9h-2V7z"/></svg>
                  File baru
                </button>
                <button class="welcome-btn" data-action="new-folder">
                  <svg viewBox="0 0 16 16"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h3.3l1.5 1.5h6.2A1.5 1.5 0 0 1 15 5v7.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H6.9L5.4 3z"/></svg>
                  Folder baru
                </button>
                <button class="welcome-btn" data-action="open-index">
                  <svg viewBox="0 0 16 16"><path d="M8 1.3 1 6.5V15h5v-4.5h4V15h5V6.5zM14 14h-3V9.5H5V14H2V7l6-4.5L14 7z"/></svg>
                  Buka index.html
                </button>
              </div>
              <div class="shortcuts">
                <span><kbd>⌘/Ctrl</kbd><kbd>S</kbd> Simpan</span>
                <span><kbd>⌘/Ctrl</kbd><kbd>B</kbd> Panel file</span>
                <span><kbd>⌘/Ctrl</kbd><kbd>\</kbd> Preview</span>
                <span><kbd>⌘/Ctrl</kbd><kbd>I</kbd> Asisten AI</span>
              </div>
            </div>
          </div>
          <footer class="editor-foot">
            <span class="foot-item" id="statusUser"></span>
            <span class="foot-spacer"></span>
            <span class="foot-item" id="statusCursor"></span>
            <span class="foot-item lang-badge" id="statusLang"></span>
            <label class="switch" title="Simpan otomatis saat mengetik">
              <input type="checkbox" id="autosave"><span class="track"><span class="thumb"></span></span>
              Auto-save
            </label>
          </footer>
        </div>

        <div class="ai-view" id="aiPanel">
          <div class="ai-messages" id="aiMessages"></div>
          <div class="ai-topup" id="aiTopupBanner" hidden>
            <span id="aiTopupText">Kredit AI kamu habis.</span>
            <button type="button" class="ai-topup-btn" id="aiTopupBtn">Isi ulang kredit</button>
          </div>
          <form class="ai-composer" id="aiForm">
            <div class="ai-blocks" id="aiBlocks" hidden></div>
            <div class="ai-attachments" id="aiAttachments" hidden></div>
            <textarea id="aiInput" rows="3" maxlength="20000"
                      placeholder="Minta AI membuat atau mengubah kode… (Enter kirim, Shift+Enter baris baru)"></textarea>
            <div class="ai-composer-foot">
              <div class="ai-mode" role="radiogroup" aria-label="Mode AI">
                <button type="button" role="radio" data-ai-mode="build" title="AI langsung menulis dan mengubah file">
                  <svg viewBox="0 0 16 16"><path d="M9.8 1.2a3.8 3.8 0 0 0-4.6 4.9L1 10.3a1.7 1.7 0 0 0 2.4 2.4l4.2-4.2a3.8 3.8 0 0 0 4.9-4.6l-2 2-1.8-.3-.3-1.8zM2.3 11.6l4.5-4.5.1.1.4.4-4.5 4.5a.4.4 0 0 1-.5-.5"/></svg>
                  Builder
                </button>
                <button type="button" role="radio" data-ai-mode="plan" title="Diskusi & susun rencana, tanpa mengubah file">
                  <svg viewBox="0 0 16 16"><path d="M2 3h1.5v1.5H2zm3 .25h9v1H5zM2 7.25h1.5v1.5H2zm3 .25h9v1H5zM2 11.5h1.5V13H2zm3 .25h9v1H5z"/></svg>
                  Plan
                </button>
              </div>
              <button type="button" class="ai-attach" id="aiAttach" title="Lampirkan gambar: desain, sketsa, atau screenshot error (bisa juga tempel/seret)" hidden>
                <svg viewBox="0 0 16 16"><path d="M2.5 2A1.5 1.5 0 0 0 1 3.5v9A1.5 1.5 0 0 0 2.5 14h11a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 13.5 2zM2 3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5v7.3l-3-3-2.5 2.5-3-3L2 11.8zM10.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/></svg>
                <span>Gambar</span>
              </button>
              <button class="ai-send" id="aiSend" type="submit" title="Kirim">
                <svg viewBox="0 0 16 16"><path d="M1 1.5 15 8 1 14.5l2-6.5 6-.5v-1l-6-.5z"/></svg>
              </button>
            </div>
          </form>
        </div>

        <div class="fn-view" id="fnView" hidden></div>

        <div class="data-view" id="dataView" hidden>
          <aside class="db-sidebar">
            <div class="db-sidebar-head">
              <span>Tabel</span>
              <button class="icon-btn" id="dbNewTable" title="Tabel baru">
                <svg viewBox="0 0 16 16"><path d="M7.5 2h1v5.5H14v1H8.5V14h-1V8.5H2v-1h5.5z"/></svg>
              </button>
            </div>
            <div class="db-table-list" id="dbTableList"></div>
            <div class="usage" id="dbUsage"></div>
          </aside>
          <section class="db-main" id="dbMain"></section>
        </div>

        <div class="diagram-view" id="diagramView" hidden>
          <div class="diagram-bar">
            <div class="seg diagram-tabs" role="tablist" aria-label="Jenis diagram">
              <button type="button" role="tab" data-diagram="usecase" title="Aktor dan fitur yang dapat dipakai">Use Case</button>
              <button type="button" role="tab" data-diagram="activity" title="Alur proses/aktivitas sistem">Activity</button>
              <button type="button" role="tab" data-diagram="sequence" title="Urutan interaksi antaraktor/objek">Sequence</button>
              <button type="button" role="tab" data-diagram="class" title="Class, atribut, method, dan relasinya">Class</button>
              <button type="button" role="tab" data-diagram="state" title="Perubahan kondisi/status objek">State</button>
              <button type="button" role="tab" data-diagram="erd" title="Struktur tabel database">ERD</button>
              <button type="button" role="tab" data-diagram="site" title="Halaman, link, dan file CSS/JS">Peta halaman</button>
              <button type="button" role="tab" data-diagram="flow" title="Halaman/script mana yang memakai tabel apa">Alur data</button>
            </div>
            <div class="diagram-tools">
              <button type="button" class="icon-btn" id="diagramInfo" title="Tentang diagram ini" aria-label="Tentang diagram ini">
                <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1m0 1a6 6 0 1 0 0 12A6 6 0 0 0 8 2m.5 5v5h-1V7zM8 4.25a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5"/></svg>
              </button>
              <span class="tool-sep"></span>
              <span class="diagram-updated" id="diagramUpdated"></span>
              <button type="button" class="diagram-update" id="diagramUpdate" disabled>
                <svg viewBox="0 0 16 16"><path d="M13.45 5.17A6 6 0 1 0 14 8h-1a5 5 0 1 1-.8-2.73l-1.7.23.14 1 3.4-.5-.5-3.4-1 .14z"/></svg>
                Update diagram
              </button>
              <span class="tool-sep"></span>
              <button type="button" class="icon-btn" id="diagramZoomOut" title="Perkecil (−)">−</button>
              <button type="button" class="zoom-label" id="diagramZoomFit" title="Pas di layar (tombol 0) · ukuran asli: tombol 1">100%</button>
              <button type="button" class="icon-btn" id="diagramZoomIn" title="Perbesar (+)">+</button>
              <span class="tool-sep"></span>
              <button type="button" class="icon-btn" id="diagramCopy" title="Salin kode Mermaid">
                <svg viewBox="0 0 16 16"><path d="M4 2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1z"/></svg>
              </button>
              <button type="button" class="icon-btn" id="diagramDownload" title="Unduh SVG">
                <svg viewBox="0 0 16 16"><path d="M7.5 1h1v8.3l2.6-2.6.7.7L8 11.2 4.2 7.4l.7-.7 2.6 2.6zM2 13h12v1H2z"/></svg>
              </button>
              <span class="tool-sep"></span>
              <button type="button" class="findings-toggle" id="diagramFindingsToggle" aria-pressed="true" title="Temuan">
                Temuan <span class="count">0</span>
              </button>
            </div>
          </div>
          <div class="diagram-body">
            <div class="diagram-canvas" id="diagramCanvas" tabindex="0" aria-label="Kanvas diagram. Scroll atau cubit untuk zoom, seret untuk geser."></div>
            <aside class="diagram-findings" id="diagramFindings" aria-label="Temuan"></aside>
          </div>
        </div>

        <div class="history-view" id="historyView" hidden>
          <div class="history-layout" id="historyLayout">
            <aside class="history-list" id="historyList" aria-label="Daftar versi"></aside>
            <button type="button" class="history-back" id="historyBack">← Semua versi</button>
            <section class="history-detail" id="historyDetail" aria-live="polite"></section>
          </div>
        </div>
      </main>
      <div class="splitter" data-target="preview"><i></i></div>

      <section class="panel preview" id="preview">
        <div class="preview-bar">
          <div class="url-pill">
            <svg class="lock" viewBox="0 0 16 16"><path d="M8 1a3 3 0 0 0-3 3v2H4a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1V4a3 3 0 0 0-3-3m2 5H6V4a2 2 0 1 1 4 0z"/></svg>
            <span class="env-badge" id="envBadge" title="Versi dev: hanya berubah di sini sampai dipublikasikan" hidden>DEV</span>
            <span class="preview-host" id="previewHost"></span>
            <input class="preview-url" id="previewUrl" spellcheck="false" autocomplete="off" autocapitalize="off"
                   aria-label="Alamat halaman preview (bisa diubah, tekan Enter)" title="Ubah alamat halaman lalu tekan Enter (Esc untuk batal)">
          </div>
          <button class="pick-btn" id="pickBlocks" title="Pilih bagian halaman yang mau diubah AI">
            <svg viewBox="0 0 16 16"><path d="M1 1h4v1H2v3H1zm10 0h4v4h-1V2h-3zM1 11h1v3h3v1H1zm6-4 7.5 3-3.1 1.2 2.3 2.4-1.1 1.1-2.3-2.4L9 15z"/></svg>
            <span>Pilih blok</span>
          </button>
          <button class="icon-btn feature-info-btn" id="previewInfo" title="Apa itu preview &amp; website online?" aria-label="Penjelasan preview">
            <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1m0 1a6 6 0 1 0 0 12A6 6 0 0 0 8 2m.5 5v5h-1V7zM8 4.25a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5"/></svg>
          </button>
          <button class="icon-btn" id="reloadPreview" title="Muat ulang preview">
            <svg viewBox="0 0 16 16"><path d="M13.45 5.17A6 6 0 1 0 14 8h-1a5 5 0 1 1-.8-2.73l-1.7.23.14 1 3.4-.5-.5-3.4-1 .14z"/></svg>
          </button>
          <a class="icon-btn" id="openPreview" target="_blank" rel="noopener" title="Buka di tab baru">
            <svg viewBox="0 0 16 16"><path d="M9 2v1h3.3L6.6 8.6l.8.8L13 3.7V7h1V2zM12 13H3V4h4V3H2v11h11V9h-1z"/></svg>
          </a>
        </div>
        <div class="device-switch" role="group" aria-label="Ukuran layar">
          <button data-device="desktop" title="Desktop">
            <svg viewBox="0 0 16 16"><path d="M1.5 2h13A1.5 1.5 0 0 1 16 3.5v8a1.5 1.5 0 0 1-1.5 1.5H10v1h2v1H4v-1h2v-1H1.5A1.5 1.5 0 0 1 0 11.5v-8A1.5 1.5 0 0 1 1.5 2m0 1a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-8a.5.5 0 0 0-.5-.5z"/></svg>
          </button>
          <button data-device="tablet" title="Tablet (768px)">
            <svg viewBox="0 0 16 16"><path d="M4 1h8a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 12 15H4a1.5 1.5 0 0 1-1.5-1.5v-11A1.5 1.5 0 0 1 4 1m0 1a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-11A.5.5 0 0 0 12 2zm3 10h2v1H7z"/></svg>
          </button>
          <button data-device="mobile" title="HP (390px)">
            <svg viewBox="0 0 16 16"><path d="M5.5 1h5A1.5 1.5 0 0 1 12 2.5v11a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 4 13.5v-11A1.5 1.5 0 0 1 5.5 1m0 1a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5h5a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5zM7 12h2v1H7z"/></svg>
          </button>
        </div>
        <div class="pick-bar" id="pickBar" hidden>
          <span class="pick-hint" id="pickHint"></span>
          <button type="button" class="pick-go" id="pickGo">Tulis perintah</button>
          <button type="button" class="pick-done" id="pickDone">Selesai</button>
        </div>
        <div class="stage" id="stage" data-device="desktop">
          <iframe id="previewFrame" title="Preview website"></iframe>
        </div>
      </section>

    </div>

    <nav class="mobile-nav" aria-label="Navigasi">
      <button type="button" data-view="files" class="coding-only">
        <svg viewBox="0 0 16 16"><path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h3.3l1.5 1.5h6.2A1.5 1.5 0 0 1 15 5v7.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5zM2.5 3a.5.5 0 0 0-.5.5v9a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V5a.5.5 0 0 0-.5-.5H6.9L5.4 3z"/></svg>
        File
      </button>
      <button type="button" data-view="editor">
        <svg class="coding-only" viewBox="0 0 16 16"><path d="M5.3 4.3 1.6 8l3.7 3.7-.7.7L.2 8l4.4-4.4zm5.4 0 .7-.7L15.8 8l-4.4 4.4-.7-.7L14.4 8z"/></svg>
        <svg class="simple-only" viewBox="0 0 16 16"><path d="M8 0l1.6 4.4L14 6l-4.4 1.6L8 12 6.4 7.6 2 6l4.4-1.6zM13 10l.8 2.2L16 13l-2.2.8L13 16l-.8-2.2L10 13l2.2-.8z"/></svg>
        <span class="coding-only">Editor</span><span class="simple-only">Chat AI</span>
      </button>
      <button type="button" data-view="preview">
        <svg viewBox="0 0 16 16"><path d="M8 3C4.5 3 1.9 5.4 1 8c.9 2.6 3.5 5 7 5s6.1-2.4 7-5c-.9-2.6-3.5-5-7-5m0 8.5A3.5 3.5 0 1 1 8 4.5a3.5 3.5 0 0 1 0 7m0-5.5a2 2 0 1 0 0 4 2 2 0 0 0 0-4"/></svg>
        Preview
      </button>
    </nav>
  </div>

  <div class="ctxmenu" id="ctxmenu" hidden></div>
  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script>
    // Monaco dimuat dari CDN; worker harus diproksikan lewat data: URL agar lolos same-origin.
    window.MONACO_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
    window.MonacoEnvironment = {
      getWorkerUrl() {
        const base = window.MONACO_BASE;
        return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
          `self.MonacoEnvironment={baseUrl:'${base}/'};importScripts('${base}/vs/base/worker/workerMain.js');`
        );
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
